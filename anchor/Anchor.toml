[toolchain]
anchor_version = "0.32.1"

[features]
resolution = true

[programs.devnet]
converge = "9VnuYqz9fkambuAVxXWkHGtf1EpzLzchSFDRvpSwNLWU"

[registry]
url = "https://api.apr.dev"

[provider]
